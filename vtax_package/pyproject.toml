[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verification-tax"
version = "1.1.0"
description = "Verification Tax: information-theoretic floors, active/passive audit rates, and confidence-quality screening for AI evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Jason Wang"}]
keywords = ["calibration", "evaluation", "verification", "ECE", "AI safety", "fairness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
cli = []
dev = ["pytest>=7.0"]

[project.scripts]
verification-tax = "verification_tax.cli:main"

[project.urls]
Paper = "https://github.com/Jason-Wang313/verification-tax"
Repository = "https://github.com/Jason-Wang313/verification-tax"

[tool.setuptools.packages.find]
where = ["."]
include = ["verification_tax*", "vtax*"]
